<style>
/* One puzzle at a time: the goal on the left, the frame and tray on a canvas, four big
   buttons under it.  Everything else lives in the menu drawer.  Dark by design; a light
   set of the same tokens follows the system setting or the choice in the menu. */
:root {
  color-scheme: light;
  --bg: #eef0f4;
  --surface: #ffffff;
  --panel: #f5f6f9;
  --paper: #ffffff;
  --line: #d5dae4;
  --line-2: #b6bfce;
  --ink: #141a2a;
  --ink-2: #39435c;
  --muted: #566179;
  --frame: #141a2a;
  --frame-fill: #ffffff;
  --dot: #c4cad6;
  --lattice: #e3e7ee;
  --accent: #141a2a;
  --accent-ink: #ffffff;
  --accent-soft: #e4e8f1;
  --focus: #2f6fdc;
  --good: #1d8a4a;
  --bad: #c0392b;
  --star: #c98a00;
  --star-off: #aab3c3;
  --tile-ink: #141a2a;
  --tile-outline: #141a2a;
  /* square colours by size, largest first; the smallest is always amber.  Tuned so every
     pair stays apart (CIEDE2000 >= 12.9) under simulated protan, deutan and tritan vision */
  --rank-0: #7491fd; --rank-1: #ff6151; --rank-2: #11b981; --rank-3: #d27eb1;
  --rank-4: #a0ebff; --rank-5: #ffff7a; --rank-6: #c3c8c6; --rank-last: #f2b800;
  --chain-h: #141a2a; --chain-v: #6b4fd8; --chain-slack: #a3acbd;
  --font-cjk: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Noto Sans SC';
  --font-display: 'Archivo', var(--font-cjk), 'Noto Sans Devanagari', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Atkinson Hyperlegible', var(--font-cjk), 'Noto Sans Devanagari', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, var(--font-cjk), 'Noto Sans Devanagari', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1626; --surface: #182238; --panel: #141d31; --paper: #182238; --line: #243150; --line-2: #3a4868;
    --ink: #f4f1ea; --ink-2: #c3cad9; --muted: #9aa6bf; --frame: #f4f1ea; --frame-fill: #131c30;
    --dot: #2c3a5c; --lattice: #243150; --accent: #f4f1ea; --accent-ink: #0f1626; --accent-soft: #243150;
    --focus: #8fd3ff; --good: #4fd18b; --bad: #ff7a6b; --star: #ffb020; --star-off: #4a5878;
    --tile-outline: transparent; --chain-h: #f4f1ea; --chain-v: #c3a6ff; --chain-slack: #5b6880;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1626; --surface: #182238; --panel: #141d31; --paper: #182238; --line: #243150; --line-2: #3a4868;
  --ink: #f4f1ea; --ink-2: #c3cad9; --muted: #9aa6bf; --frame: #f4f1ea; --frame-fill: #131c30;
  --dot: #2c3a5c; --lattice: #243150; --accent: #f4f1ea; --accent-ink: #0f1626; --accent-soft: #243150;
  --focus: #8fd3ff; --good: #4fd18b; --bad: #ff7a6b; --star: #ffb020; --star-off: #4a5878;
  --tile-outline: transparent; --chain-h: #f4f1ea; --chain-v: #c3a6ff; --chain-slack: #5b6880;
}

html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: 0.4; cursor: default; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app {
  box-sizing: border-box;
  min-height: 100vh;
  max-width: 1600px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto 1fr;
}

/* header */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 16px;
  flex-wrap: wrap;
  padding: 18px 40px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; margin: 0; font: 800 24px/1.1 var(--font-display); letter-spacing: -0.01em; }
.brand svg { flex: none; }
.top-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.icon-btn {
  flex: none; width: 44px; height: 44px; border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); padding: 0;
}
.mode-switch { display: flex; padding: 4px; border-radius: 26px; background: var(--surface); border: 1px solid var(--line-2); }
.mode-switch button { height: 40px; padding: 0 18px; border-radius: 20px; border: 0; background: transparent; color: var(--ink-2); font: 800 16px var(--font-display); white-space: nowrap; }
.mode-switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.drawer .mode-switch { align-self: flex-start; }
.drawer .mode-switch button { border: 0; background: transparent; padding: 0 18px; font: 800 16px var(--font-display); color: var(--ink-2); }
.drawer .mode-switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.menu-mode { display: none !important; }
.lang-wrap { position: relative; display: inline-flex; align-items: center; min-width: 0; }
.lang-wrap svg { position: absolute; left: 13px; width: 18px; height: 18px; color: var(--ink-2); pointer-events: none; }
.lang-pick {
  height: 44px; min-width: 0; max-width: 15em; box-sizing: border-box;
  padding: 0 14px 0 38px; border-radius: 22px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink); font: 700 15px var(--font-body);
}

/* the play area: lead + side text on the left, the board on the right, buttons below it */
main {
  display: grid;
  grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
  grid-template-rows: auto 1fr;
  grid-template-areas: "lead stage" "side stage";
  gap: 18px 44px;
  padding: 28px 40px 32px;
  min-height: 0;
}
.lead { grid-area: lead; display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }
.side { grid-area: side; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stage { grid-area: stage; display: flex; flex-direction: column; gap: 18px; min-width: 0; align-self: start; position: sticky; top: 12px; }
/* the board fills the window's height less the header, the padding and the buttons */
.table { position: relative; min-width: 0; height: max(420px, calc(100vh - 230px)); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

.level-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font: 800 17px var(--font-display); color: var(--muted); }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 22px; height: 22px; }
.goal { margin: 0; font: 800 50px/1.03 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
.goal-sub { margin: 0; font-size: 20px; color: var(--ink-2); }

.progress { display: flex; justify-content: space-between; gap: 8px; font-size: 16px; color: var(--muted); }
.timer { font-variant-numeric: tabular-nums; }
.timer.done { color: var(--good); font-weight: 700; }
.bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.bar b { display: block; height: 100%; width: 0; background: var(--ink); transition: width 0.2s; }
.status { font-size: 17px; color: var(--ink-2); min-height: 2.9em; }
.status.solved { color: var(--good); font-weight: 700; }
.status.warn { color: var(--bad); }
.hints { margin: 0; padding-left: 1.3em; font-size: 16px; color: var(--ink-2); }
.hints li + li { margin-top: 6px; }
.free-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.free-panel .option > span { font-size: 16px; color: var(--ink-2); }
.n-chips { display: flex; gap: 6px; }
.n-chips button { flex: 1; height: 46px; border-radius: 23px; border: 2px solid var(--line-2); background: transparent; color: var(--ink-2); font: 800 18px var(--font-display); padding: 0; }
.n-chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.free-panel .btn { height: 50px; font-size: 17px; }
.free-panel > .btn { width: 100%; }
.loader { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.loader label { font-size: 16px; color: var(--ink-2); }
.loader-row { display: flex; gap: 8px; }
.loader input { flex: 1; min-width: 0; height: 50px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); font: 500 16px var(--font-mono); }
.loader .btn { padding: 0 18px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.switch-row label { display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
.sw-title { font: 800 17px var(--font-display); }
.sw-note { font-size: 14px; color: var(--muted); }
.switch { flex: none; position: relative; width: 56px; height: 32px; border-radius: 16px; border: 0; padding: 0; background: var(--line-2); }
.switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 12px; background: var(--ink); transition: left 0.15s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { left: 28px; background: #0f1626; }
.solved-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.solved-card h3 { margin: 0 0 6px; font: 800 30px var(--font-display); color: var(--good); }
.solved-card p { margin: 0 0 8px; font-size: 17px; color: var(--ink-2); }
.solved-card p:last-child { margin-bottom: 0; }
.answer-plain { margin: 0; font-size: 17px; }
.answer-plain:empty { display: none; }
.levels-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.levels-head span { color: var(--muted); font-size: 15px; }
.lv-group { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.lv-title { display: flex; align-items: center; gap: 10px; font: 800 15px var(--font-display); }
.lv-title .stars svg { width: 16px; height: 16px; }
.lv-title small { font: 400 14px var(--font-body); color: var(--muted); }
.lv-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
/* a level tile: its number while unsolved, the packing once solved; the current one ringed */
.drawer .lv-grid button.lv {
  position: relative; aspect-ratio: 1; height: auto; padding: 0; border-radius: 6px;
  border: 2px solid var(--line-2); background: transparent; color: var(--ink-2); font: 800 20px var(--font-display);
}
.drawer .lv-grid button.lv.solved { border-color: transparent; background: var(--frame-fill); }
.lv canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 4px; }
.lv.solved .num {
  position: absolute; right: 2px; bottom: 2px; min-width: 18px; padding: 0 4px; box-sizing: border-box;
  border-radius: 4px; background: var(--panel); color: var(--ink); font: 800 13px/18px var(--font-display);
}
.drawer .lv-grid button.lv.current { border-color: var(--star); box-shadow: 0 0 0 2px var(--star); color: var(--ink); }
.text-btn { align-self: flex-start; border: 0; background: none; padding: 4px 0; color: var(--ink-2); font: 700 15px var(--font-body); text-decoration: underline; text-underline-offset: 3px; }
.text-btn:hover { color: var(--ink); }

canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas.dragging { cursor: grabbing !important; }
#board { position: absolute; inset: 0; border-radius: 10px; }

.btn {
  height: 54px; padding: 0 28px; border-radius: 27px;
  border: 2px solid var(--line-2); background: transparent; color: var(--ink);
  font: 800 18px var(--font-display); white-space: nowrap;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { color: var(--muted); }
.btn:not(:disabled):hover { border-color: var(--ink-2); }
.btn .arrow { margin-left: 6px; }
.btn .ico { display: none; }

/* answer (moves to the solved card and the Advanced panel in later steps) */
.answer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: 15px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.tabs button { padding: 3px 10px; font: 600 14px var(--font-mono); border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel); }
.tabs button[aria-selected="true"] { background: var(--accent-soft); border-color: var(--ink); }
.strategy { font: 800 22px var(--font-display); margin: 0 0 4px; }
.strategy small { font: 500 14px var(--font-mono); color: var(--muted); margin-left: 6px; }
.formula { font-family: var(--font-mono); font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
.formula b { color: var(--star); }
.defs { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.verdict { margin: 10px 0 0; }
sub { font-size: 0.72em; line-height: 0; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 0 0 8px; }
.ledger { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 4px; }
.ledger td { padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ledger td.num { text-align: right; white-space: nowrap; }
.ledger td.terms { color: var(--muted); overflow-wrap: anywhere; }
.ledger tr.win td, .ledger tr.win td.terms { color: var(--star); font-weight: 600; }
.ledger tr.pick { cursor: pointer; }
.ledger tr.pick:hover td { background: var(--accent-soft); }
.ledger tr.floor td { border-bottom: 2px solid var(--ink); color: var(--muted); font-style: italic; }
.ledger-wrap { max-height: 320px; overflow-y: auto; }
details summary { cursor: pointer; font-size: 14px; color: var(--muted); }
.contacts { border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; margin-top: 6px; }
.contacts th, .contacts td { padding: 2px 10px 2px 0; text-align: left; }
.contacts th { font-size: 12px; color: var(--muted); font-weight: 500; }

/* menu drawer */
dialog.drawer {
  margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(440px, 100vw); max-width: 100vw; box-sizing: border-box;
  border: 0; border-left: 1px solid var(--line); padding: 0; background: var(--panel); color: var(--ink);
}
dialog.drawer::backdrop { background: rgba(5, 8, 15, 0.55); }
.drawer-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; font: 800 22px var(--font-display); }
.drawer-body { padding: 8px 20px 40px; display: flex; flex-direction: column; }
.drawer-body > section { padding: 18px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.drawer-body > section:last-child { border-bottom: 0; }
.drawer-body h3 { margin: 0; font: 800 17px var(--font-display); }
.drawer button:not(.icon-btn), .drawer select, .drawer input[type="text"], .drawer input[type="number"] {
  border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--ink);
  padding: 8px 12px; font-size: 15px;
}
.drawer button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.error { color: var(--bad); font-size: 14px; flex-basis: 100%; }
.error:empty { display: none; }
.seg { position: relative; justify-self: start; align-self: flex-start; display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 7px 12px; font-size: 14px; cursor: pointer; background: var(--surface); border-left: 1px solid var(--line-2); }
.seg label:first-of-type { border-left: 0; }
.seg input:checked + label { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.seg input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: -3px; }
.option { display: grid; gap: 5px; }
.option > span { font-size: 14px; color: var(--muted); }
.gravity { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 6px; }
.gravity button, .turns button { padding: 0 !important; font: 700 18px var(--font-mono) !important; }
.gravity [data-dir="up"] { grid-column: 2; grid-row: 1; }
.gravity [data-dir="left"] { grid-column: 1; grid-row: 2; }
.gravity [data-dir="down"] { grid-column: 2; grid-row: 2; }
.gravity [data-dir="right"] { grid-column: 3; grid-row: 2; }
.turns { display: grid; grid-template-columns: repeat(2, 44px); grid-auto-rows: 44px; gap: 6px; }
.help { font-size: 15px; color: var(--ink-2); margin: 0; padding-left: 1.1em; }
.help li + li { margin-top: 4px; }
kbd { font: 600 13px var(--font-mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }
.about { font-size: 14px; color: var(--ink-2); }
.about p { margin: 0 0 8px; }
.about a { color: var(--ink); overflow-wrap: anywhere; }
.about .ver { font: 500 13px var(--font-mono); color: var(--muted); }


:lang(zh) .eyebrow, :lang(hi) .eyebrow { letter-spacing: 0.02em; }
:lang(zh) .goal, :lang(hi) .goal, :lang(zh) .brand, :lang(hi) .brand { letter-spacing: 0; }

/* medium windows: a narrower text column so the board and the buttons keep their room */
@media (max-width: 1200px) {
  main { grid-template-columns: minmax(230px, 300px) minmax(0, 1fr); gap: 16px 32px; }
  .goal { font-size: 40px; }
  .btn { padding: 0 20px; font-size: 17px; }
}
/* phones and narrow windows: one column, board right after the goal */
@media (max-width: 900px) {
  .top { padding: 12px 16px; }
  .brand { font-size: 20px; }
  main {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto;
    grid-template-areas: "lead" "stage" "side";
    gap: 14px;
    padding: 16px 16px 28px;
  }
  .lead { padding-top: 0; gap: 8px; }
  .goal { font-size: 32px; }
  .goal-sub { font-size: 17px; }
  .stage { position: static; gap: 14px; }
  .table { height: max(380px, min(640px, calc(100svh - 300px))); }
  .actions { justify-content: stretch; flex-wrap: wrap; gap: 8px; }
  .actions .btn { flex: 1 1 auto; height: 52px; padding: 0 14px; font-size: 17px; }
  /* Start over and Skip shrink to icons; Next level keeps its words */
  .actions .btn.compact { flex: 0 0 52px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .actions .btn.compact .ico { display: block; }
  .actions .btn.compact .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .actions .btn.compact .arrow { margin: 0; font-size: 22px; }
  .actions .btn.compact.primary { flex: 1 1 auto; padding: 0 14px; }
  .actions .btn.compact.primary .label { position: static; width: auto; height: auto; overflow: visible; clip: auto; }
  .actions .btn.compact.primary .arrow { margin-left: 6px; font-size: inherit; }
  .status { min-height: 0; }
  .lang-pick { max-width: 11em; }
  .top-mode { display: none !important; }
  .menu-mode { display: flex !important; }
}
@media (max-width: 1080px) and (min-width: 901px) {
  .mode-switch button { padding: 0 12px; font-size: 15px; }
}
@media (max-width: 420px) {
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { .bar b { transition: none; } }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1 class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="4" width="16" height="16" rx="1.5" fill="#7491fd"/><rect x="20" y="4" width="10" height="10" rx="1.5" fill="#ff6151"/><rect x="4" y="20" width="10" height="10" rx="1.5" fill="#11b981"/><rect x="20" y="20" width="7" height="7" rx="1.5" fill="#f2b800"/></svg>
      <span data-i18n="app.name">Square Packing</span>
    </h1>
    <div class="mode-switch top-mode" role="group" data-i18n-aria="aria.mode" aria-label="Mode">
      <button type="button" data-mode="level" data-i18n="levels.title">Levels</button>
      <button type="button" data-mode="free" data-i18n="mode.free">Free play</button>
    </div>
    <div class="top-right">
      <span class="lang-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9.2"/><path d="M2.8 12h18.4M12 2.8c2.6 2.6 3.9 5.6 3.9 9.2s-1.3 6.6-3.9 9.2M12 2.8C9.4 5.4 8.1 8.4 8.1 12s1.3 6.6 3.9 9.2"/>
        </svg>
        <select id="lang-pick" class="lang-pick" aria-label="Language" title="Language"></select>
      </span>
      <button type="button" class="icon-btn" id="menu-btn" aria-haspopup="dialog" data-i18n-aria="aria.menu" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="lead" aria-labelledby="goal">
      <div class="level-line"><span id="level-label"></span><span class="stars" id="stars" role="img"></span></div>
      <h2 class="goal" id="goal"></h2>
      <p class="goal-sub" id="goal-sub"></p>
      <button type="button" class="text-btn" id="builds-on" hidden></button>
    </section>

    <div class="stage">
    <div class="table" id="table">
      <canvas id="board" tabindex="0" data-i18n-aria="aria.board" aria-label="Packing board"></canvas>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="hint-btn"></button>
      <button type="button" class="btn" id="answer-btn"></button>
      <button type="button" class="btn compact" id="start-over">
        <svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
        <span class="label" data-i18n="btn.reset"></span>
      </button>
      <button type="button" class="btn quiet compact" id="skip-btn"><span class="label" id="skip-label"></span><span class="arrow" aria-hidden="true">→</span></button>
    </div>
    </div>

    <section class="side">
      <section class="free-panel" id="free-panel" hidden aria-labelledby="free-n-label">
        <div class="option"><span id="free-n-label" data-i18n="free.howMany">How many squares?</span>
          <div class="n-chips" id="n-chips" role="group" aria-labelledby="free-n-label">
            <button type="button" data-n="4">4</button><button type="button" data-n="5">5</button><button type="button" data-n="6">6</button><button type="button" data-n="7">7</button><button type="button" data-n="8">8</button>
          </div>
        </div>
        <button type="button" class="btn primary" id="new-puzzle" data-i18n="free.newRandom">New random puzzle</button>
        <form class="loader" id="loader" autocomplete="off">
          <label for="sides-input" data-i18n="label.orSides">Or type your own side lengths</label>
          <div class="loader-row">
            <input type="text" id="sides-input" inputmode="numeric" placeholder="19 16 13 12 10 9 8" aria-describedby="input-error">
            <button type="submit" class="btn" data-i18n="btn.load">Play</button>
          </div>
          <div class="error" id="input-error" role="alert"></div>
        </form>
        <div class="switch-row">
          <label for="adv-switch"><span class="sw-title" data-i18n="adv.title">Advanced</span><span class="sw-note" data-i18n="adv.note"></span></label>
          <button type="button" class="switch" id="adv-switch" role="switch" aria-checked="false"></button>
        </div>
      </section>
      <div>
        <div class="progress"><span id="progress"></span><span class="timer" id="timer">0:00</span></div>
        <div class="bar"><b id="bar"></b></div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <section class="solved-card" id="solved" hidden aria-live="polite">
        <h3 data-i18n="solved.title">Packed!</h3>
        <p id="solved-stats"></p>
        <p id="solved-why"></p>
      </section>
      <ol class="hints" id="hints" aria-live="polite" hidden></ol>
      <button type="button" class="text-btn" id="clear-hints" data-i18n="btn.clearHints" hidden>Clear hints</button>
      <section class="answer" id="answer" hidden>
        <p class="answer-plain" id="answer-plain"></p>
        <div id="answer-tech">
        <div class="tabs" id="tabs" role="tablist" data-i18n-aria="aria.tabs" aria-label="Optimal strategies" hidden></div>
        <p class="strategy" id="strategy"></p>
        <div class="formula" id="formula"></div>
        <div class="defs" id="defs"></div>
        <p class="verdict" id="verdict"></p>
        <div id="ledger-block">
          <p class="eyebrow" style="margin-top:14px" data-i18n="ans.ledger">Every strategy, cheapest first</p>
          <div class="ledger-wrap"><table class="ledger" id="ledger"></table></div>
        </div>
        <details style="margin-top:12px">
          <summary data-i18n="ans.contacts">Contact table of this packing</summary>
          <table class="contacts" id="contacts"></table>
        </details>
        </div>
      </section>
    </section>
  </main>
  <div class="sr" id="sr" aria-live="polite"></div>
</div>

<dialog class="drawer" id="menu" aria-labelledby="menu-title">
  <div class="drawer-head">
    <h2 id="menu-title" data-i18n="menu.title">Menu</h2>
    <button type="button" class="icon-btn" id="menu-close" data-i18n-aria="menu.close" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <section class="menu-mode">
      <div class="mode-switch" role="group" data-i18n-aria="aria.mode" aria-label="Mode">
        <button type="button" data-mode="level" data-i18n="levels.title">Levels</button>
        <button type="button" data-mode="free" data-i18n="mode.free">Free play</button>
      </div>
    </section>

    <section id="levels-section">
      <div class="levels-head"><h3 data-i18n="levels.title">Levels</h3><span id="levels-count"></span></div>
      <div id="levels-list"></div>
    </section>

    <section>
      <h3 data-i18n="move.eyebrow">Move the packing</h3>
      <div class="row">
        <div class="gravity" id="gravity">
          <button type="button" data-dir="up" data-i18n-aria="aria.pushUp" aria-label="Push up">↑</button>
          <button type="button" data-dir="left" data-i18n-aria="aria.pushLeft" aria-label="Push left">←</button>
          <button type="button" data-dir="down" data-i18n-aria="aria.pushDown" aria-label="Push down">↓</button>
          <button type="button" data-dir="right" data-i18n-aria="aria.pushRight" aria-label="Push right">→</button>
        </div>
        <div class="turns" id="turns">
          <button type="button" data-op="ccw" data-i18n-title="title.ccw" data-i18n-aria="aria.ccw" aria-label="Turn left">⟲</button>
          <button type="button" data-op="cw" data-i18n-title="title.cw" data-i18n-aria="aria.cw" aria-label="Turn right">⟳</button>
          <button type="button" data-op="flipH" data-i18n-title="title.flipH" data-i18n-aria="aria.flipH" aria-label="Mirror left to right">⇆</button>
          <button type="button" data-op="flipV" data-i18n-title="title.flipV" data-i18n-aria="aria.flipV" aria-label="Mirror top to bottom">⇅</button>
        </div>
      </div>
      <div class="row">
        <button type="button" id="shuffle" data-i18n="btn.shuffle">Shuffle</button>
      </div>
    </section>

    <section>
      <h3 data-i18n="opt.display">Display</h3>
      <div class="option"><span data-i18n="opt.theme">Colours</span>
        <div class="seg" role="radiogroup" data-i18n-aria="opt.theme" aria-label="Colours">
          <input type="radio" name="theme" id="theme-auto" value="auto" checked><label for="theme-auto" data-i18n="theme.auto">Automatic</label>
          <input type="radio" name="theme" id="theme-dark" value="dark"><label for="theme-dark" data-i18n="theme.dark">Dark</label>
          <input type="radio" name="theme" id="theme-light" value="light"><label for="theme-light" data-i18n="theme.light">Light</label>
        </div>
      </div>
      <div class="option"><span data-i18n="opt.labels">Labels</span>
        <div class="seg" role="radiogroup" data-i18n-aria="opt.labels" aria-label="Labels">
          <input type="radio" name="labels" id="labels-value" value="value" checked><label for="labels-value" data-i18n="labels.value">Side</label>
          <input type="radio" name="labels" id="labels-index" value="index"><label for="labels-index" data-i18n="labels.index">Index</label>
          <input type="radio" name="labels" id="labels-none" value="none"><label for="labels-none" data-i18n="labels.none">None</label>
        </div>
      </div>
    </section>

    <section>
      <h3 data-i18n="help.eyebrow">How to play</h3>
      <ul class="help">
        <li data-i18n="help.drag"></li>
        <li data-i18n="help.snap"></li>
        <li data-i18n="help.double"></li>
        <li data-i18n-html="help.buttons"></li>
        <li data-i18n="help.levels"></li>
        <li data-i18n-html="help.free"></li>
        <li data-i18n="help.amber"></li>
        <li data-i18n="help.rank"></li>
        <li data-i18n-html="help.push"></li>
        <li data-i18n-html="help.turn"></li>
        <li data-i18n-html="help.keys"></li>
      </ul>
    </section>

    <section class="about" id="about">
      <h3><span data-i18n="about.eyebrow">About</span> <span class="ver">v0.2.0</span></h3>
      <p id="about-what"></p>
      <p id="about-papers"></p>
      <p id="about-source"></p>
      <p id="about-langs"></p>
      <p id="about-privacy" data-i18n="about.privacy"></p>
      <p id="about-license"></p>
    </section>
  </div>
</dialog>

<script>
/*
 * i18n.js — every word the player sees, by language.
 *
 * t(key, params) looks the key up in the current language, falling back to English, and

<script>
/*
 * formula.js — exact formulas, strategy ledger and canonical placements for L*_n, n <= 8.
 *
 * Input is a side vector s = [s_0, ..., s_{n-1}] of positive integers, sorted
 * non-increasingly.  Every value and every coordinate is a signed sum of sides, so all
 * arithmetic is exact in IEEE doubles (far below 2^53); there is no tolerance anywhere.
 *
 * Structure used throughout.  For n >= 5,
 *     L*_n = max( L*_{n-1}(s_0..s_{n-2}),  min_k  strategy_k(s) ),
 *     strategy_k(s) = max over the terms of strategy k of the term's side-sum,
 * with L*_1 = s_0 and L*_2 = L*_3 = L*_4 = s_0 + s_1.  The strategy lists are:
 *     n = 5   shelf    s_2+s_3+s_4
 *     n = 6   column   s_1+s_4+s_5
 *     n = 7   top / center / right                      (three strategies)
 *     n = 8   alpha .. psi                              (twenty-three strategies)
 * Strategy k is realised by an explicit packing valid at L = max(L*_{n-1}, strategy_k).
 *
 * Runs in the browser (global SPFormula) and under Node (module.exports).
 */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------- term sets
  const C0 = [0, 5, 6], C3 = [1, 3, 6], R = [1, 4, 5, 6], W = [3, 4, 5, 6], H = [1, 2, 5];

  // Terms that recur from the L*_7 picture keep their names in labels.
  const TERM_NAMES = new Map([
    ['0,5,6', 'C_0'], ['1,3,6', 'C_3'], ['1,4,5,6', 'R'], ['3,4,5,6', 'W'], ['1,2,5', 'H'],
  ]);

  // Strategies per n, in display order.  n = 8 uses the canonical alpha..psi order
  // (descending essentiality on the s_0 = 44 slice); n = 7 uses the panel order
  // top / center / right.
  const STRATEGIES = {
    4: [],
    5: [{ id: 'shelf', terms: [[2, 3, 4]] }],
    6: [{ id: 'column', terms: [[1, 4, 5]] }],
    7: [
      { id: 'top', terms: [W, H] },
      { id: 'center', terms: [C0, C3] },
      { id: 'right', terms: [R] },
    ],
    8: [
      { id: 'alpha', terms: [[0, 4, 7], [1, 2, 7], [1, 3, 5], C0] },
      { id: 'beta', terms: [[0, 3, 7], [2, 5, 6, 7], C0, C3] },
      { id: 'gamma', terms: [[0, 3, 7], [1, 2, 6], C0] },
      { id: 'delta', terms: [[0, 4, 5], [1, 2, 7], C3] },
      { id: 'epsilon', terms: [[2, 4, 6, 7], C0, [1, 3, 4]] },
      { id: 'zeta', terms: [[1, 2, 4], W, [0, 6, 7]] },
      { id: 'eta', terms: [[0, 3, 6], [1, 2, 7]] },
      { id: 'theta', terms: [[0, 2, 7], C0, C3] },
      { id: 'iota', terms: [[2, 5, 6, 7], [1, 3, 5], [0, 4, 7], C0] },
      { id: 'kappa', terms: [[1, 2, 4], [3, 4, 6, 7], C0] },
      { id: 'lambda', terms: [[2, 5, 6, 7], C3, [0, 4, 5]] },
      { id: 'mu', terms: [C0, [1, 4, 6, 7], [1, 3, 5]] },
      { id: 'nu', terms: [[1, 3, 7], [0, 6, 7], R] },
      { id: 'xi', terms: [[2, 4, 5, 6], [1, 3, 6, 7], [1, 3, 5]] },
      { id: 'omicron', terms: [[0, 4, 7], W, H] },
      { id: 'pi', terms: [C0, [1, 3, 6, 7]] },
      { id: 'rho', terms: [[1, 4, 5, 7], C0, C3] },
      { id: 'sigma', terms: [[2, 3, 5, 6], [1, 4, 6, 7]] },
      { id: 'tau', terms: [[2, 3, 6, 7], [1, 4, 5, 6]] },
      { id: 'upsilon', terms: [[2, 3, 4, 6], [1, 5, 6, 7]] },
      { id: 'phi', terms: [[1, 2, 6, 7], W, H] },
      { id: 'chi', terms: [[0, 5, 6, 7], C3] },
      { id: 'psi', terms: [[1, 4, 5, 6, 7]] },
    ],
  };

  // Display names.  The n <= 6 names are provisional.
  const GREEK = {
    alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', epsilon: 'ε', zeta: 'ζ', eta: 'η',
    theta: 'θ', iota: 'ι', kappa: 'κ', lambda: 'λ', mu: 'μ', nu: 'ν', xi: 'ξ',
    omicron: 'ο', pi: 'π', rho: 'ρ', sigma: 'σ', tau: 'τ', upsilon: 'υ', phi: 'φ',
    chi: 'χ', psi: 'ψ',
  };
  const DISPLAY = Object.assign({
    pair: 'pair', windowpane: 'windowpane', shelf: 'shelf', column: 'column',
    top: 'top', center: 'center', right: 'right',
  }, GREEK);

  // ---------------------------------------------------------------- arithmetic
  function termSum(s, t) {
    let v = 0;
    for (const i of t) v += s[i];
    return v;
  }

  function termLabel(t) {
    return TERM_NAMES.get(t.join(',')) || t.map(i => 's_' + i).join('+');
  }

  function strategyValue(s, terms) {
    let v = -Infinity;
    for (const t of terms) { const x = termSum(s, t); if (x > v) v = x; }
    return v;
  }

  function checkInput(s) {
    if (!Array.isArray(s) || s.length < 1 || s.length > 8)
      throw new RangeError('expected 1 to 8 sides');
    for (let i = 0; i < s.length; i++) {
      if (!Number.isSafeInteger(s[i]) || s[i] <= 0)
        throw new RangeError('sides must be positive integers');
      if (i > 0 && s[i] > s[i - 1])
        throw new RangeError('sides must be sorted non-increasingly');
    }
  }

  // L*_n for the first n entries of s; no input check (internal, hot path).
  function lstar(s, n) {
    if (n === 1) return s[0];
    if (n <= 4) return s[0] + s[1];
    const floor = lstar(s, n - 1);
    let mn = Infinity;
    for (const st of STRATEGIES[n]) {
      const v = strategyValue(s, st.terms);
      if (v < mn) mn = v;
    }
    return mn > floor ? mn : floor;
  }

  /** L*_n of the side vector s (n = s.length). */
  function Lstar(s) {
    checkInput(s);
    return lstar(s, s.length);
  }

  // ---------------------------------------------------------------- placements
  // Each placer returns the lower-left corners, indexed by square: P[i] = [x_i, y_i].
  // Valid (inside [0,L]^2, interiors disjoint) whenever L >= max(L*_{n-1}, the strategy).

  function fromMap(m, n) {
    const P = new Array(n);
    for (const k in m) P[+k] = m[k];
    return P;
  }

  // n <= 6 share one skeleton: s_0 lower left, s_1 lower right, the top shelf
  // s_2, s_3, s_4 with s_2 and s_4 cornered, s_5 on the right wall above s_1.
  function placeBase(s, L) {
    const n = s.length, P = [];
    P[0] = [0, 0];
    if (n >= 2) P[1] = [L - s[1], 0];
    if (n === 3) P[2] = [0, L - s[2]];
    if (n === 4) { P[2] = [0, L - s[2]]; P[3] = [L - s[3], L - s[3]]; }
    if (n >= 5) {
      P[2] = [0, L - s[2]]; P[3] = [s[2], L - s[3]]; P[4] = [L - s[4], L - s[4]];
    }
    if (n >= 6) P[5] = [L - s[5], s[1]];
    return P;
  }

  const PLACE7 = {
    // s_6 on the top edge between s_4 and the cornered s_5; s_2 on the right wall.
    top: (s, L) => fromMap({
      0: [0, 0], 1: [L - s[1], 0], 2: [L - s[2], s[1]], 3: [0, L - s[3]],
      4: [s[3], L - s[4]], 6: [s[3] + s[4], L - s[6]], 5: [L - s[5], L - s[5]],
    }, 7),
    // the n = 6 skeleton, s_6 interior with its lower-right corner at s_5's lower-left
    center: (s, L) => { const P = placeBase(s.slice(0, 6), L); P[6] = [L - s[5] - s[6], s[1]]; return P; },
    // the n = 6 skeleton, s_6 on the right wall just above s_5
    right: (s, L) => { const P = placeBase(s.slice(0, 6), L); P[6] = [L - s[6], s[1] + s[5]]; return P; },
  };

  // n = 8: ported from verify_L8_general.py (place_alpha .. place_psi).
  function omegaBase(s, L) {
    return {
      0: [0, 0], 1: [L - s[1], 0], 2: [0, L - s[2]], 3: [s[2], L - s[3]],
      4: [L - s[4], L - s[4]], 5: [L - s[5], s[1]], 6: [L - s[5] - s[6], s[1]],
    };
  }
  function stair(s, L, top3, right3) {
    const m = {
      0: [0, 0], 1: [L - s[1], 0], 2: [0, L - s[2]], 3: [s[2], L - s[3]],
      6: [L - s[6], L - s[6]], 4: [L - s[4], s[1]],
    };
    m[top3] = [s[2] + s[3], L - s[top3]];
    m[right3] = [L - s[right3], s[1] + s[4]];
    return fromMap(m, 8);
  }

  const PLACE8 = {
    alpha: (s, L) => fromMap({ 0: [0, 0], 6: [s[0], 0], 5: [L - s[5], 0], 2: [0, L - s[2]],
      7: [s[2], s[0]], 1: [L - s[1], L - s[3] - s[1]], 3: [L - s[3], L - s[3]],
      4: [L - s[3] - s[4], L - s[4]] }, 8),
    beta: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 2: [0, L - s[2]], 3: [s[2], L - s[3]],
      4: [L - s[4], L - s[4]], 5: [L - s[5], s[1]], 6: [L - s[5] - s[6], s[1]],
      7: [L - s[5] - s[6] - s[7], s[0]] }, 8),
    gamma: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 7: [0, s[0]], 3: [0, L - s[3]],
      6: [s[0], s[1]], 5: [L - s[5], s[1]], 2: [s[3], L - s[2]], 4: [L - s[4], L - s[4]] }, 8),
    delta: (s, L) => fromMap({ 0: [0, 0], 5: [0, s[0]], 4: [0, L - s[4]], 1: [L - s[1], 0],
      7: [s[0], s[1]], 6: [L - s[6], s[1]], 2: [s[4], L - s[2]], 3: [L - s[3], L - s[3]] }, 8),
    epsilon: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 2: [0, L - s[2]],
      4: [L - s[4], L - s[4]], 7: [s[2], L - s[7]], 6: [s[2] + s[7], L - s[6]],
      5: [s[2], s[0]], 3: [L - s[3], s[1]] }, 8),
    zeta: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 2: [L - s[2], s[1]], 7: [0, s[0]],
      6: [0, L - s[6]], 3: [s[6], L - s[3]], 5: [s[6] + s[3], L - s[5]],
      4: [L - s[4], L - s[4]] }, 8),
    eta: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 6: [0, s[0]], 3: [0, L - s[3]],
      5: [L - s[5], s[1]], 7: [L - s[5] - s[7], s[1]], 4: [L - s[4], L - s[4]],
      2: [s[3], L - s[2]] }, 8),
    theta: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 2: [0, L - s[2]], 3: [s[2], L - s[3]],
      4: [L - s[4], L - s[4]], 5: [L - s[5], s[1]], 6: [L - s[5] - s[6], s[1]], 7: [0, s[0]] }, 8),
    iota: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 2: [0, L - s[2]], 3: [L - s[3], L - s[3]],
      4: [s[2], L - s[4]], 5: [L - s[5], s[1]], 6: [L - s[5] - s[6], s[1]], 7: [s[2], s[0]] }, 8),
    kappa: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 2: [L - s[2], s[1]],
      4: [L - s[4], L - s[4]], 3: [0, L - s[3]], 6: [s[3], L - s[6]],
      7: [s[3] + s[6], L - s[7]], 5: [s[3], s[0]] }, 8),
    lambda: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 2: [0, L - s[2]], 3: [L - s[3], L - s[3]],
      4: [s[2], L - s[4]], 6: [L - s[6], s[1]], 7: [L - s[6] - s[7], s[1]], 5: [s[2], s[0]] }, 8),
    mu: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 2: [0, L - s[2]], 3: [s[2], L - s[3]],
      4: [L - s[4], L - s[4]], 6: [L - s[6], s[1]], 7: [L - s[7], s[1] + s[6]],
      5: [L - s[6] - s[5], s[1]] }, 8),
    nu: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 2: [0, L - s[2]], 3: [s[2], L - s[3]],
      4: [L - s[4], L - s[4]], 6: [L - s[6], s[1]], 5: [L - s[5], s[1] + s[6]],
      7: [L - s[6] - s[7], s[1]] }, 8),
    xi: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 2: [0, L - s[2]], 6: [L - s[6], L - s[6]],
      3: [L - s[3], s[1]], 7: [L - s[7], s[1] + s[3]], 4: [s[2], L - s[4]],
      5: [s[2] + s[4], L - s[5]] }, 8),
    omicron: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 2: [L - s[2], s[1]],
      5: [L - s[5], L - s[5]], 3: [0, L - s[3]], 4: [s[3], L - s[4]],
      6: [s[3] + s[4], L - s[6]], 7: [s[3], L - s[4] - s[7]] }, 8),
    pi: (s, L) => { const m = omegaBase(s, L); m[7] = [L - s[5] - s[7], s[1] + s[6]]; return fromMap(m, 8); },
    rho: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 2: [0, L - s[2]], 3: [s[2], L - s[3]],
      4: [L - s[4], L - s[4]], 5: [L - s[5], s[1]], 7: [L - s[7], s[1] + s[5]],
      6: [L - s[5] - s[6], s[1]] }, 8),
    sigma: (s, L) => stair(s, L, 5, 7),
    tau: (s, L) => stair(s, L, 7, 5),
    upsilon: (s, L) => fromMap({ 0: [0, 0], 2: [0, L - s[2]], 3: [s[2], L - s[3]],
      4: [s[2] + s[3], L - s[4]], 6: [L - s[6], L - s[6]], 1: [L - s[1], 0],
      5: [L - s[5], s[1]], 7: [L - s[7], s[1] + s[5]] }, 8),
    phi: (s, L) => fromMap({ 0: [0, 0], 1: [0, L - s[1]], 2: [s[1], L - s[2]],
      7: [s[1] + s[2], L - s[7]], 6: [L - s[6], L - s[6]], 3: [L - s[3], 0],
      4: [L - s[4], s[3]], 5: [L - s[5], s[3] + s[4]] }, 8),
    chi: (s, L) => { const m = omegaBase(s, L); m[7] = [L - s[5] - s[6] - s[7], s[1]]; return fromMap(m, 8); },
    psi: (s, L) => fromMap({ 0: [0, 0], 1: [L - s[1], 0], 2: [0, L - s[2]], 3: [s[2], L - s[3]],
      4: [L - s[4], s[1]], 5: [L - s[5], s[1] + s[4]], 6: [L - s[6], s[1] + s[4] + s[5]],
      7: [L - s[7], L - s[7]] }, 8),
  };

  /** Canonical placement of strategy `id` for s at side L (n <= 6: id is ignored). */
  function place(id, s, L) {
    const n = s.length;
    if (n <= 6) return placeBase(s, L);
    const table = n === 7 ? PLACE7 : PLACE8;
    const f = table[id];
    if (!f) throw new RangeError(`no strategy ${id} for n = ${n}`);
    return f(s, L);
  }

  /** True iff P packs the squares of s inside [0,L]^2 with disjoint interiors. */
  function isPacking(s, P, L) {
    const n = s.length;
    for (let i = 0; i < n; i++) {
      const [x, y] = P[i];
      if (x < 0 || y < 0 || x + s[i] > L || y + s[i] > L) return false;
    }
    for (let i = 0; i < n; i++) {
      const [ax, ay] = P[i];
      for (let j = i + 1; j < n; j++) {
        const [bx, by] = P[j];
        if (ax < bx + s[j] && bx < ax + s[i] && ay < by + s[j] && by < ay + s[i]) return false;
      }
    }
    return true;
  }

  // ---------------------------------------------------------------- chains
  // A horizontal chain has pairwise disjoint x-shadows; a vertical chain disjoint
  // y-shadows.  When both hold, the axis whose shadows leave the smaller total gap is
  // chosen, so the drawn bar is the one the squares actually line up along.
  function shadowGap(s, P, t, k) {
    const iv = t.map(i => [P[i][k], P[i][k] + s[i]]).sort((a, b) => a[0] - b[0]);
    let gap = 0;
    for (let j = 1; j < iv.length; j++) {
      if (iv[j][0] < iv[j - 1][1]) return Infinity;
      gap += iv[j][0] - iv[j - 1][1];
    }
    return gap;
  }

  /** 'h', 'v', or null if the squares of t are not a chain in P. */
  function chainAxis(s, P, t) {
    const gh = shadowGap(s, P, t, 0), gv = shadowGap(s, P, t, 1);
    if (gh === Infinity && gv === Infinity) return null;
    return gh <= gv ? 'h' : 'v';
  }

  // Every term in the formula tree up to level n (the pair, then each level's terms).
  const TREE_TERMS = {};
  for (let n = 1; n <= 8; n++) {
    const seen = new Map();
    const add = t => { if (Math.max(...t) < n) seen.set(t.join(','), t); };
    if (n >= 2) add([0, 1]);
    for (let m = 5; m <= n; m++) for (const st of STRATEGIES[m]) st.terms.forEach(add);
    TREE_TERMS[n] = [...seen.values()];
  }

  /** Terms of the formula tree whose sum is L and which are chains in P. */
  function tightChains(s, P, L) {
    const out = [];
    for (const t of TREE_TERMS[s.length]) {
      const sum = termSum(s, t);
      if (sum !== L) continue;
      const axis = chainAxis(s, P, t);
      if (axis) out.push({ label: termLabel(t), indices: t.slice(), sum, axis });
    }
    return out;
  }

  // ---------------------------------------------------------------- analysis
  function ledgerAt(s, n) {
    return STRATEGIES[n].map(st => {
      const value = strategyValue(s, st.terms);
      return {
        id: st.id, name: DISPLAY[st.id], value,
        terms: st.terms.map(t => ({ indices: t.slice(), label: termLabel(t), sum: termSum(s, t) })),
        attaining: st.terms.filter(t => termSum(s, t) === value).map(termLabel),
      };
    });
  }

  /*
   * Floor attribution: the smallest m with L*_m(s_0..s_{m-1}) = L*_n(s), and the
   * strategies binding at that level.  Since L*_2 = L*_3 = L*_4, m lies in {2,5,6,7,8};
   * m = 2 means the pair s_0+s_1 decides.  At level m >= 5 the min is strictly above
   * L*_{m-1}, so the binding strategies are exactly that level's winners.
   */
  function attribution(s, L) {
    let m = 2;
    while (m < s.length && lstar(s, m) !== L) m++;
    if (m <= 4) return { level: 2, strategies: ['pair'], terms: ['s_0+s_1'] };
    const led = ledgerAt(s, m);
    const winners = led.filter(e => e.value === L);
    return {
      level: m,
      strategies: winners.map(e => e.id),
      terms: [...new Set(winners.flatMap(e => e.attaining))],
    };
  }

  /*
   * Everything the game needs about s:
   *   n, L (= L*_n), floor (= L*_{n-1}), ledger (one entry per strategy at level n),
   *   winners (ids attaining the min), cls ('unique' | 'tied' | 'free'),
   *   reveal: [{ id, L, positions, chains }] — one canonical packing at side L for each
   *           winner (unique / tied), or for every strategy that fits under the floor,
   *           cheapest first (free),
   *   attribution (free seeds only): which level and strategy bind the floor.
   *
   * n = 4 has no strategies and is always 'free' (L*_4 = L*_3 = s_0+s_1); its reveal is
   * the windowpane.  n <= 3 is accepted but not used by the game.
   */
  function analyze(s) {
    checkInput(s);
    s = s.slice();
    const n = s.length;
    const L = lstar(s, n);
    if (n <= 4) {
      const P = placeBase(s, L);
      return {
        n, s, L, floor: n === 1 ? 0 : (n <= 2 ? s[0] : L), ledger: [], winners: [],
        cls: n <= 2 ? 'unique' : 'free',
        reveal: [{ id: n === 4 ? 'windowpane' : 'pair', L, positions: P,
                   chains: [{ label: 's_0+s_1', indices: [0, 1], sum: s[0] + s[1],
                              axis: chainAxis(s, P, [0, 1]), tight: true }],
                   tightChains: tightChains(s, P, L) }],
        attribution: n <= 2 ? null : { level: 2, strategies: ['pair'], terms: ['s_0+s_1'] },
      };
    }
    const floor = lstar(s, n - 1);
    const ledger = ledgerAt(s, n);
    const mn = Math.min(...ledger.map(e => e.value));
    const winners = ledger.filter(e => e.value === mn).map(e => e.id);
    const cls = mn <= floor ? 'free' : winners.length === 1 ? 'unique' : 'tied';

    // strategies shown in the reveal: the winners, or for a free seed every strategy
    // that fits under the floor, cheapest first (ties in display order)
    const shown = cls !== 'free' ? winners
      : ledger.map((e, i) => [e, i]).filter(([e]) => e.value <= L)
          .sort((p, q) => p[0].value - q[0].value || p[1] - q[1]).map(([e]) => e.id);
    const reveal = shown.map(id => {
      const P = place(id, s, L);
      const entry = ledger.find(e => e.id === id);
      return {
        id, name: DISPLAY[id], L, positions: P,
        chains: entry.terms.map(t => ({
          label: t.label, indices: t.indices, sum: t.sum,
          axis: chainAxis(s, P, t.indices), tight: t.sum === L,
        })),
        tightChains: tightChains(s, P, L),
      };
    });

    return {
      n, s, L, floor, ledger, winners, cls, reveal,
      attribution: cls === 'free' ? attribution(s, L) : null,
    };
  }

  const api = {
    STRATEGIES, DISPLAY, TERM_NAMES,
    Lstar, analyze, place, isPacking, chainAxis, tightChains, strategyValue, termSum, termLabel,
    attribution: s => { checkInput(s); return attribution(s, lstar(s, s.length)); },
    _lstar: lstar, _ledgerAt: ledgerAt,
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SPFormula = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
